name: personal_finance
description: مدیریت مالی شخصی
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  google_mlkit_text_recognition: ^0.15.0
  pdfx: ^2.6.0
  http: ^1.2.2
  path_provider: ^2.1.4
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  fl_chart: ^0.69.0
  local_auth: ^2.3.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
