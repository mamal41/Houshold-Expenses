name: Build Android APK
on:
  push:
    branches: [main, master, apk-build-test]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --org com.personalfinance .
      - name: Configure stable release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            cat > android/app/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=release
          storeFile=release.keystore
          EOF
            echo "Release signing secrets found; APK will be signed with the stable release key."
          else
            echo "No RELEASE_KEYSTORE_BASE64 secret set; falling back to the debug key (every build will need a manual uninstall to update)."
          fi
          if [ -f android/app/build.gradle.kts ]; then
            cat >> android/app/build.gradle.kts <<'KTS'

          val releaseKeystorePropertiesFile = file("key.properties")
          val releaseKeystoreProperties = java.util.Properties()
          if (releaseKeystorePropertiesFile.exists()) {
              releaseKeystoreProperties.load(java.io.FileInputStream(releaseKeystorePropertiesFile))
          }

          android {
              signingConfigs {
                  create("release") {
                      if (releaseKeystorePropertiesFile.exists()) {
                          storeFile = file(releaseKeystoreProperties["storeFile"] as String)
                          storePassword = releaseKeystoreProperties["storePassword"] as String
                          keyAlias = releaseKeystoreProperties["keyAlias"] as String
                          keyPassword = releaseKeystoreProperties["keyPassword"] as String
                      }
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = if (releaseKeystorePropertiesFile.exists()) signingConfigs.getByName("release") else signingConfigs.getByName("debug")
                  }
              }
          }
          KTS
          fi
          if [ -f android/app/build.gradle ]; then
            cat >> android/app/build.gradle <<'GROOVY'

          def releaseKeystorePropertiesFile = file("key.properties")
          def releaseKeystoreProperties = new Properties()
          if (releaseKeystorePropertiesFile.exists()) {
              releaseKeystoreProperties.load(new FileInputStream(releaseKeystorePropertiesFile))
          }

          android {
              signingConfigs {
                  release {
                      if (releaseKeystorePropertiesFile.exists()) {
                          storeFile file(releaseKeystoreProperties['storeFile'])
                          storePassword releaseKeystoreProperties['storePassword']
                          keyAlias releaseKeystoreProperties['keyAlias']
                          keyPassword releaseKeystoreProperties['keyPassword']
                      }
                  }
              }
              buildTypes {
                  release {
                      signingConfig = releaseKeystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
                  }
              }
          }
          GROOVY
          fi
      - name: Add ProGuard rules for ML Kit
        run: |
          mkdir -p android/app
          cat >> android/app/proguard-rules.pro <<'PROGUARD'
          # Google ML Kit text recognition ships optional per-script recognizers
          # (Chinese, Japanese, Korean, Devanagari) as separate artifacts that
          # this app does not depend on. Tell R8 to ignore the missing classes
          # instead of failing the build over them.
          -dontwarn com.google.mlkit.vision.text.chinese.**
          -dontwarn com.google.mlkit.vision.text.japanese.**
          -dontwarn com.google.mlkit.vision.text.korean.**
          -dontwarn com.google.mlkit.vision.text.devanagari.**

          # R8 minification in release builds can otherwise strip or rename
          # ML Kit / Play Services internal classes that are only reached via
          # reflection, which crashes at runtime with a null-object exception
          # on real devices even though the release build itself succeeds.
          -keep class com.google.mlkit.** { *; }
          -keep class com.google.android.gms.** { *; }
          -keep class com.google.android.gms.internal.mlkit_vision_text_common.** { *; }
          -keep class com.google.android.gms.internal.mlkit_vision_text_bundled_common.** { *; }
          -keep interface com.google.mlkit.** { *; }
          -dontwarn com.google.mlkit.**
          -dontwarn com.google.android.gms.**
          PROGUARD
      - name: Remove default test (uses old template)
        run: rm -f test/widget_test.dart
      - name: Get dependencies
        run: flutter pub get
      - name: Patch file_picker compileSdk to 36 (AGP 9 requires >=36)
        run: |
          shopt -s nullglob
          files=($HOME/.pub-cache/hosted/pub.dev/file_picker-*/android/build.gradle.kts $HOME/.pub-cache/hosted/pub.dev/file_picker-*/android/build.gradle)
          for f in "${files[@]}"; do
            echo "--- before ($f) ---"
            grep -n -i compileSdk "$f" || true
            sed -i \
              -e 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 36/' \
              -e 's/compileSdk flutter\.compileSdkVersion/compileSdk 36/' \
              -e 's/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion 36/' \
              -e 's/compileSdk = [0-9][0-9]*/compileSdk = 36/' \
              -e 's/compileSdk [0-9][0-9]*/compileSdk 36/' \
              -e 's/compileSdkVersion [0-9][0-9]*/compileSdkVersion 36/' \
              "$f"
            echo "--- after ($f) ---"
            grep -n -i compileSdk "$f" || true
          done
      - name: Analyze Dart code
        run: flutter analyze
      - name: Build release APK
        run: flutter build apk --release
      - name: Verify APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Modiriat-Mali-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
