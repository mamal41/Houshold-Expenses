name: Build Android APK
on:
  push:
    branches: [main, master, apk-build-test]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --org com.personalfinance .
      - name: Force compileSdk 36 across all Android modules (Gradle init script)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/compileSdk36.gradle <<'GROOVY'
          allprojects {
              plugins.withId('com.android.library') {
                  android {
                      compileSdkVersion 36
                  }
              }
              plugins.withId('com.android.application') {
                  android {
                      compileSdkVersion 36
                  }
              }
          }
          GROOVY
      - name: Add ProGuard rules for ML Kit
        run: |
          mkdir -p android/app
          cat >> android/app/proguard-rules.pro <<'PROGUARD'
          # Google ML Kit text recognition ships optional per-script recognizers
          # (Chinese, Japanese, Korean, Devanagari) as separate artifacts that
          # this app does not depend on. Tell R8 to ignore the missing classes
          # instead of failing the build over them.
          -dontwarn com.google.mlkit.vision.text.chinese.**
          -dontwarn com.google.mlkit.vision.text.japanese.**
          -dontwarn com.google.mlkit.vision.text.korean.**
          -dontwarn com.google.mlkit.vision.text.devanagari.**
          PROGUARD
      - name: Remove default test (uses old template)
        run: rm -f test/widget_test.dart
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze
      - name: Build release APK
        run: flutter build apk --release
      - name: Verify APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Modiriat-Mali-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
