name: Build Android APK
on:
  push:
    branches: [main, master, apk-build-test]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --org com.personalfinance .
      - name: Remove default test (uses old template)
        run: rm -f test/widget_test.dart
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze
      - name: Build release APK
        run: flutter build apk --release
      - name: Verify APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Modiriat-Mali-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
