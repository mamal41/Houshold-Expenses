name: Build Windows app
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write # publishes the installer as a release, for the in-app update
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: Flutter 3.50 deprecates package:flutter/material.dart
          # (moving to package:material_ui), which fails the analysis.
          flutter-version: 3.47.9
          cache: true
      - name: Generate Windows project
        run: flutter create --platforms=windows --org com.personalfinance --project-name personal_finance .
      - name: Remove default test (uses old template)
        shell: bash
        run: rm -f test/widget_test.dart
      - name: Set Persian window title
        shell: bash
        run: |
          # The same name as on the phone; written as \u escapes so the
          # compiler reads it right whatever the source file encoding.
          sed -i 's/window.Create(L"[^"]*"/window.Create(L"\\u0645\\u062f\\u06cc\\u0631\\u06cc\\u062a\\u0020\\u0645\\u0627\\u0644\\u06cc\\u0020\\u0634\\u062e\\u0635\\u06cc"/' windows/runner/main.cpp
          grep -n 'window.Create' windows/runner/main.cpp
          # Window centred and sized to the screen, with a minimum size.
          python installer/patch_windows_runner.py windows/runner
      - name: Allow local_auth_windows with the current compiler
        shell: bash
        run: |
          # local_auth_windows still uses <experimental/coroutine>, which the
          # newest Visual Studio refuses unless this is defined.
          sed -i '0,/^project(.*/s//&\nadd_compile_definitions(_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)/' windows/CMakeLists.txt
          grep -n -A1 '^project(' windows/CMakeLists.txt
          grep -q _SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS windows/CMakeLists.txt
      - name: Get dependencies
        run: flutter pub get
      - name: Generate app icon
        shell: bash
        run: |
          cat > flutter_launcher_icons-windows.yaml <<'YAML'
          flutter_launcher_icons:
            image_path: "assets/icon/icon.png"
            windows:
              generate: true
              image_path: "assets/icon/icon.png"
              icon_size: 256
          YAML
          dart run flutter_launcher_icons -f flutter_launcher_icons-windows.yaml
      - name: Check the Google client secrets (without showing them)
        env:
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        shell: bash
        run: |
          id=$(echo "$GOOGLE_DESKTOP_CLIENT_ID" | tr -d '[:space:]')
          secret=$(echo "$GOOGLE_DESKTOP_CLIENT_SECRET" | tr -d '[:space:]')
          trimmed=$(printf '%s' "$GOOGLE_DESKTOP_CLIENT_ID" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          [ "$trimmed" != "$GOOGLE_DESKTOP_CLIENT_ID" ] && echo "::warning::GOOGLE_DESKTOP_CLIENT_ID has spaces or line breaks around it (removed)"
          [ "$id" != "$trimmed" ] && echo "::warning::GOOGLE_DESKTOP_CLIENT_ID has spaces or line breaks INSIDE it (removed)"
          printf '%s' "$id" | LC_ALL=C grep -q '[^ -~]' && echo "::warning::GOOGLE_DESKTOP_CLIENT_ID contains invisible or non-ASCII characters"
          if [ -z "$id" ]; then echo "::warning::GOOGLE_DESKTOP_CLIENT_ID is not set"
          elif [[ "$id" =~ ^[0-9]+-[a-z0-9]+\.apps\.googleusercontent\.com$ ]]; then echo "GOOGLE_DESKTOP_CLIENT_ID looks right (${#id} characters)"
          else echo "::warning::GOOGLE_DESKTOP_CLIENT_ID does not look like a client id (should be like 1234-abc.apps.googleusercontent.com)"; fi
          if [ -z "$secret" ]; then echo "::warning::GOOGLE_DESKTOP_CLIENT_SECRET is not set"
          elif [[ "$secret" == GOCSPX-* ]]; then echo "GOOGLE_DESKTOP_CLIENT_SECRET looks right"
          else echo "::warning::GOOGLE_DESKTOP_CLIENT_SECRET does not start with GOCSPX-"; fi
      - name: Build release
        # The Google client for signing in from Windows (for syncing with
        # the phone) comes from the repository secrets; without them the
        # app works, only sync can't be turned on.
        env:
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        shell: bash
        run: |
          # Without any whitespace copied along with the values.
          GOOGLE_DESKTOP_CLIENT_ID=$(printf '%s' "$GOOGLE_DESKTOP_CLIENT_ID" | tr -d '[:space:]')
          GOOGLE_DESKTOP_CLIENT_SECRET=$(printf '%s' "$GOOGLE_DESKTOP_CLIENT_SECRET" | tr -d '[:space:]')
          flutter build windows --release --no-tree-shake-icons \
            --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} \
            --dart-define=WINDOWS_BUILD=${{ github.run_number }} \
            --dart-define=GOOGLE_DESKTOP_CLIENT_ID="$GOOGLE_DESKTOP_CLIENT_ID" \
            --dart-define=GOOGLE_DESKTOP_CLIENT_SECRET="$GOOGLE_DESKTOP_CLIENT_SECRET"
      - name: Package
        shell: pwsh
        run: |
          $out = "Modiriat-Mali-Windows"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Recurse -Force build\windows\x64\runner\Release\* $out
          if (-not (Test-Path "$out\personal_finance.exe")) { throw "exe missing" }
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DBuild=${{ github.run_number }}" installer\windows.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          if (-not (Test-Path installer-output\ModiriatMali-Setup.exe)) { throw "installer missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: Modiriat-Mali-Windows
          path: Modiriat-Mali-Windows
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Modiriat-Mali-Windows-Setup
          path: installer-output/ModiriatMali-Setup.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish for the in-app update
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          # GitHub sometimes refuses or loses a release made the same moment
          # as the other workflow's: retry, then check the file is there.
          tag="windows-v${{ github.run_number }}"
          notes="$(printf '%s\n' "${NOTES:-}" | grep -v -E '^(Co-Authored-By|Claude-Session):' || true)"
          for attempt in 1 2 3 4 5; do
            gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1 ||
              gh release create "$tag" --repo "${{ github.repository }}" --target "${{ github.sha }}" \
                --title "Windows 1.0.${{ github.run_number }}" --notes "$notes" --latest=false || true
            gh release upload "$tag" installer-output/ModiriatMali-Setup.exe --repo "${{ github.repository }}" --clobber && break
            sleep $((attempt * 15))
          done
          gh release view "$tag" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | grep -qx "$(basename installer-output/ModiriatMali-Setup.exe)"
